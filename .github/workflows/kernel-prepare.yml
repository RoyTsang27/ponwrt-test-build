name: Prepare Airoha kernels

on:
  push:
    paths:
      - target/linux/generic/**
      - target/linux/airoha/**
      - .github/workflows/kernel-prepare.yml
      - feeds.conf.release
  pull_request:
    paths:
      - target/linux/generic/**
      - target/linux/airoha/**
      - .github/workflows/kernel-prepare.yml
      - feeds.conf.release
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare ${{ matrix.target }} kernel patches
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl xz-utils zstd
      - name: Prepare kernel and apply patch stack
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cp feeds.conf.release feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/kconfig.pl + "configs/$TARGET.config" configs/release.config > .config
          make defconfig
          python3 scripts/check-release.py --config .config
          make target/linux/prepare -j"$(nproc)" V=s
